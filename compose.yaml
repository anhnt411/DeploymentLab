
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deployment_lab
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - deploymentlab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d deployment_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: DeploymentLab.Api/Dockerfile
    image: deploymentlab-api:v1
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=deployment_lab;Username=labuser;Password=${DB_PASSWORD}"
    ports:
      - "127.0.0.1:5180:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./DeploymentLab.Web
      dockerfile: Dockerfile

    image: deploymentlab-web:v1

    ports:
      - "127.0.0.1:8088:80"

    depends_on:
      - api

volumes:
  deploymentlab-pgdata:
    external: true


    
