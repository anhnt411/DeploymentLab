name: DeploymentLab CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore DeploymentLab.Api/DeploymentLab.Api.csproj

      - name: Build Backend
        run: dotnet build DeploymentLab.Api/DeploymentLab.Api.csproj --configuration Release --no-restore
