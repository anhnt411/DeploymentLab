name: DeploymentLab CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore DeploymentLab.Api/DeploymentLab.Api.csproj

      - name: Build Backend
        run: dotnet build DeploymentLab.Api/DeploymentLab.Api.csproj --configuration Release --no-restore

  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DeploymentLab.Web

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: DeploymentLab.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production

  publish-images:
    name: Publish Docker Images
    needs: [build-backend, build-frontend]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./DeploymentLab.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/anhnt411/deploymentlab-api:dev
            ghcr.io/anhnt411/deploymentlab-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/anhnt411/DeploymentLab

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./DeploymentLab.Web
          file: ./DeploymentLab.Web/Dockerfile
          push: true
          tags: |
            ghcr.io/anhnt411/deploymentlab-web:dev
            ghcr.io/anhnt411/deploymentlab-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/anhnt411/DeploymentLab

