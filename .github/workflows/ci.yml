name: DeploymentLab CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore DeploymentLab.Api/DeploymentLab.Api.csproj

      - name: Build Backend
        run: dotnet build DeploymentLab.Api/DeploymentLab.Api.csproj --configuration Release --no-restore

  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DeploymentLab.Web

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: DeploymentLab.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production
